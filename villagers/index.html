<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Villagers - guest intelligence for high-touch investor events. Build the list, know everyone, walk in ready." />
  <title>Villagers | Guest intelligence by Pallas Taylor</title>
  <link rel="stylesheet" href="villagers.css?v=8" />
</head>
<body>

  <!--
    Villagers - see README.md for architecture and the honest
    real-vs-stubbed list. Never commit a real guest list to this repo.
  -->

  <!-- Host gate: private email-link authentication through Supabase Auth.
       Guest RSVP pages at #/rsvp/<token> skip this gate entirely. -->
  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <div class="brand-mark">V</div>
      <p class="eyebrow">Villagers · by Pallas Taylor</p>
      <h1>Walk in<br /><em>ready.</em></h1>
      <p class="gate-note">Enter your host email to continue.</p>
      <input id="gate-input" type="email" placeholder="Host email" autocomplete="email" />
      <button id="gate-button" class="button" type="button">Email me a sign-in link</button>
      <p id="gate-error" class="gate-error" hidden>That email does not have host access.</p>
    </div>
  </div>

  <header class="site-header" id="site-header">
    <a class="brand" href="#/">
      <span class="brand-mark">V</span>
      <span class="brand-word">Villagers <small>by Pallas Taylor</small></span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="events">Events</a>
      <a href="#/people" data-nav="people">People</a>
      <a href="#/after" data-nav="after">After</a>
    </nav>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="site-footer">
    <span>Villagers · Guest intelligence for hosts</span>
    <span class="muted">A Pallas Taylor tool · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=8"></script>
  <script src="app.js?v=8"></script>
  <script src="views-event.js?v=8"></script>
  <script src="views-pages.js?v=8"></script>
  <script>boot();</script>
</body>
</html>
